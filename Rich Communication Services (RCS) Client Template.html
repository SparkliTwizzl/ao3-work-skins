<html>
  <head>
    <link rel="stylesheet" href="Rich Communication Services (RCS) Client Template.css">
  </head>
  <body>
    <div id="workskin">

      <h1>Light theme (Default)</h1>

      <dl class="rcs light-theme">
        <h1>Theodore Roosevelt</h1>

        <div class="sent message">
          <span class="text"><span class="hide sender">Julius Caesar:</span>Lorem ipsum dolor sit amet.</span>
        </div>

        <div class="received message">
          <span class="text"><span class="hide sender">Theodore Roosevelt:</span>Talk quiet and smack people.</span>
        </div>
      </dl>

      <h1>Dark theme</h1>

      <dl class="rcs dark-theme">
        <h1>Theodore Roosevelt</h1>

        <div class="sent message">
          <span class="text"><span class="hide sender">Julius Caesar:</span>Lorem ipsum dolor sit amet.</span>
        </div>

        <div class="received message">
          <span class="text"><span class="hide sender">Theodore Roosevelt:</span>Talk quiet and smack people.</span>
        </div>
      </dl>

    </div>
  </body>
</html>
